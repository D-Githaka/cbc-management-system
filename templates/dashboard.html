{% extends 'base.html' %}
{% block content %}

<h2 class="mb-4">Dashboard</h2>

<div class="row">

    <div class="col-md-4">
        <div class="card p-3 shadow-sm">
            <h6>Total Schools</h6>
            <h3>{{ schools_count }}</h3>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 shadow-sm">
            <h6>Total Students</h6>
            <h3>{{ students_count }}</h3>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 shadow-sm">
            <h6>Total Subjects</h6>
            <h3>{{ subjects_count }}</h3>
        </div>
    </div>

</div>

{% endblock %}
