{% extends 'base.html' %}
{% block content %}

<h2>Schools</h2>

<a href="{{ url_for('add_school') }}" class="btn btn-primary mb-3">Add School</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Students</th>
        </tr>
    </thead>
    <tbody>
    {% for school in schools %}
        <tr>
            <td>
                <a href="{{ url_for('analytics', school_id=school.id) }}">{{ school.name }}</a>
            </td>
            <td>{{ school.students|length }}</td>
            <td>
                {% if current_user.role == 'admin' %}
                <a href="{{ url_for('edit_school', id=school.id) }}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{{ url_for('delete_school', id=school.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this school?')">Delete</a>
                {% endif %}
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>

{% endblock %}
