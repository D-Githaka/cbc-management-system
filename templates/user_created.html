{% extends 'base.html' %}
{% block content %}

<div class="card p-4 shadow-sm text-center">

    <h3>User Created ✅</h3>

    <p><strong>Username:</strong> {{ username }}</p>
    <p><strong>Password:</strong> 
        <span id="pwd" class="font-monospace p-1 bg-light border rounded">{{ password }}</span>
        <button type="button" id="copyBtn" class="btn btn-sm btn-outline-secondary" onclick="copyPassword()">📋 Copy</button>
    </p>

    <p class="text-danger">
        ⚠️ Save this password now. It will not be shown again.
    </p>

    <a href="{{ url_for('manage_users') }}" class="btn btn-dark mt-3">Back</a>

</div>

<script>
function copyPassword() {
    const pwd = document.getElementById("pwd").innerText;
    const btn = document.getElementById("copyBtn");
    
    if (!navigator.clipboard) {
        // Fallback for non-HTTPS / non-secure environments
        const textArea = document.createElement("textarea");
        textArea.value = pwd;
        document.body.appendChild(textArea);
        textArea.select();
        try {
            document.execCommand('copy');
            btn.innerHTML = "✅ Copied!";
            setTimeout(() => btn.innerHTML = "📋 Copy", 2000);
        } catch (err) {
            alert("Could not copy text automatically. Please select it manually.");
        }
        document.body.removeChild(textArea);
        return;
    }

    navigator.clipboard.writeText(pwd).then(() => {
        // Smooth visual state switch instead of intrusive browser alerts
        btn.classList.replace("btn-outline-secondary", "btn-success");
        btn.innerHTML = "✅ Copied!";
        setTimeout(() => {
            btn.classList.replace("btn-success", "btn-outline-secondary");
            btn.innerHTML = "📋 Copy";
        }, 2000);
    });
}
</script>

{% endblock %}
