{% extends 'base.html' %}

{% block content %}
<h2>Edit Student</h2>
<a href="{{ url_for('students') }}" class="text-decoration-none mb-3 d-inline-block">← Back to Students</a>
<form method="POST" class="card p-4 shadow-sm">

    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" class="form-control"
               value="{{ student.name }}">
    </div>

    <div class="mb-3">
        <label>Grade</label>
        <select name="grade" class="form-select">
            {% for g in ["PP1","PP2","Grade 1","Grade 2","Grade 3","Grade 4","Grade 5","Grade 6","Grade 7","Grade 8","Grade 9"] %}
                <option value="{{ g }}" {% if g == student.grade %}selected{% endif %}>{{ g }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>School</label>
        <select name="school_id" class="form-select">
            {% for school in schools %}
                <option value="{{ school.id }}"
                    {% if school.id == student.school_id %}selected{% endif %}>
                    {{ school.name }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
    <label>Gender</label>
    <select name="gender" class="form-select" required>
        <option value="M">Male</option>
        <option value="F" {% if student and student.gender == 'F' %}selected{% endif %}>Female</option>
    </select>
</div>
    <button class="btn btn-primary">Update</button>
</form>
{% endblock %}
