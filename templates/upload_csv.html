{% extends 'base.html' %}
{% block content %}
<h2>Upload Students CSV</h2>
<a href="{{ url_for('main.students') }}" class="text-decoration-none mb-3 d-inline-block">← Back to Students</a>

<div class="card p-4 shadow-sm">
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">CSV File</label>
            <input type="file" name="csv_file" class="form-control" accept=".csv" required>
            <small class="text-muted">
                Required columns: <strong>name</strong>, <strong>grade</strong>.<br>
                Optional: add subject columns (e.g., "Math", "English") to import marks.<br>
                Also provide term and year to save marks.
            </small>
        </div>

        {% if current_user.role == 'admin' %}
        <div class="mb-3">
            <label class="form-label">Target School</label>
            <select name="school_id" class="form-select" required>
                <option value="">Select School</option>
                {% for s in schools %}
                <option value="{{ s.id }}">{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Term (if importing marks)</label>
                <select name="term" class="form-select">
                    <option value="">None</option>
                    <option value="Term 1">Term 1</option>
                    <option value="Term 2">Term 2</option>
                    <option value="Term 3">Term 3</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Year (if importing marks)</label>
                <input type="number" name="year" class="form-control" placeholder="e.g. 2026">
            </div>
        </div>

        <button class="btn btn-primary">Upload & Import</button>
    </form>
</div>
{% endblock %}
