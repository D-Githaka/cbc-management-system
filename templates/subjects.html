{% extends 'base.html' %}
{% block content %}

<h2>Subjects</h2>
<h4>Filter By Grade</h4>
<form method="GET" class="mb-3">
    <select name="grade" class="form-select" onchange="this.form.submit()">
        <option value="">All Grades</option>
        {% for g in ["Grade 1","Grade 2","Grade 3","Grade 4","Grade 5","Grade 6","Grade 7","Grade 8","Grade 9"] %}
            <option value="{{ g }}" {% if g == grade %}selected{% endif %}>
                {{ g }}
            </option>
        {% endfor %}
    </select>
</form>

<a href="/add_subject" class="btn btn-primary mb-3">Add Subject</a>

<table class="table">
<tr>
    <th>Name</th>
    <th>Actions</th>
</tr>

{% for subject in subjects %}
<tr>
    <td>{{ subject.name }}</td>
    <td>
        <a href="/edit_subject/{{ subject.id }}" class="btn btn-warning btn-sm">Edit</a>
        <a href="/delete_subject/{{ subject.id }}"
           class="btn btn-danger btn-sm"
           onclick="return confirm('Delete this subject?')">
           Delete
        </a>
    </td>
</tr>
{% endfor %}

</table>

{% endblock %}
