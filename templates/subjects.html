{% extends 'base.html' %}
{% block content %}

<h2>Subjects</h2>
<h4>Filter By Grade</h4>
<form method="GET" class="mb-3">
    <select name="grade" class="form-select" onchange="this.form.submit()">
        {% for g in all_grades %}
            <option value="{{ g }}" {% if g == grade %}selected{% endif %}>{{ g }}</option>
        {% endfor %}
    </select>
</form>

{% if current_user.role == 'admin' %}
<a href="{{ url_for('main.add_subject', grade=grade) }}" class="btn btn-success">Add Subject</a>
{% endif %}

<table class="table">
<tr>
    <th>Name</th>
    <th>Actions</th>
</tr>

{% for subject in subjects %}
<tr>
    <td>{{ subject.name }}</td>
    <td>
        {% if current_user.role == 'admin' %}
            <a href="{{ url_for('main.edit_subject', id=subject.id, grade=grade) }}" class="btn btn-warning btn-sm">Edit</a>
<a href="{{ url_for('main.delete_subject', id=subject.id, grade=grade) }}" class="btn btn-danger btn-sm" onclick="return confirm(...)">Delete</a>
        {% endif %}
    </td>
</tr>
{% endfor %}

</table>

{% endblock %}
