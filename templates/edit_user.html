{% extends 'base.html' %}
{% block content %}
<h2>Edit User – {{ user.username }}</h2>

<form method="POST" class="card p-4 shadow-sm" style="max-width:500px;">
    <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Role</label>
        <select name="role" class="form-select" {% if current_user.role != 'admin' %}disabled{% endif %}>
            <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
            <option value="principal" {% if user.role == 'principal' %}selected{% endif %}>Principal</option>
            <option value="teacher" {% if user.role == 'teacher' %}selected{% endif %}>Teacher</option>
        </select>
        {% if current_user.role != 'admin' %}
        <input type="hidden" name="role" value="{{ user.role }}">
        {% endif %}
    </div>
    <div class="mb-3">
        <label class="form-label">School</label>
        <select name="school_id" class="form-select" {% if current_user.role != 'admin' %}disabled{% endif %}>
            {% for s in schools %}
                <option value="{{ s.id }}" {% if s.id == user.school_id %}selected{% endif %}>{{ s.name }}</option>
            {% endfor %}
        </select>
        {% if current_user.role != 'admin' and user.school_id %}
        <input type="hidden" name="school_id" value="{{ user.school_id }}">
        {% endif %}
    </div>
    <div class="mb-3">
        <label class="form-label">Grade (teachers only)</label>
        <select name="grade" class="form-select">
            <option value="">None</option>
            {% for g in ["PP1","PP2","Grade 1","Grade 2","Grade 3","Grade 4","Grade 5","Grade 6","Grade 7","Grade 8","Grade 9"] %}
                <option value="{{ g }}" {% if g == user.grade %}selected{% endif %}>{{ g }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">New Password (leave blank to keep current)</label>
        <input type="password" name="password" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Update User</button>
    <a href="{{ url_for('manage_users') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
