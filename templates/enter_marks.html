{% extends 'base.html' %}

{% block content %}
<h2>Enter Marks</h2>
<a href="{{ url_for('marks.marks') }}" class="text-decoration-none mb-3 d-inline-block">← Back to Marks</a>
<!-- Grade Selector -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="saveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<form method="GET" class="row g-2 mb-3">

    <div class="col">
        <select name="grade" class="form-select">
            <option value="">Grade</option>
            {% for g in ["PP1","PP2","Grade 1","Grade 2","Grade 3","Grade 4","Grade 5","Grade 6","Grade 7","Grade 8","Grade 9"] %}
                <option value="{{ g }}" {% if g == grade %}selected{% endif %}>{{ g }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="col">
        <select name="term" class="form-select">
            <option value="">Term</option>
            {% for t in ["Term 1","Term 2","Term 3"] %}
                <option value="{{ t }}" {% if t == term %}selected{% endif %}>{{ t }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col">
        <select name="exam" class="form-select">
            <option value="">Select Exam</option>
            <option value="Exam 1" {% if exam == 'Exam 1' %}selected{% endif %}>Exam 1</option>
            <option value="Exam 2" {% if exam == 'Exam 2' %}selected{% endif %}>Exam 2</option>
            <option value="Exam 3" {% if exam == 'Exam 3' %}selected{% endif %}>Exam 3</option>
        </select>
    </div>
    <div class="col">

       <select name="year" class="form-select">
          <option value="">Year</option>
          {% for y in range(2021, 2031) %}
            <option value="{{ y }}" {% if y|string == year|string %}selected{% endif %}>
              {{ y }}
            </option>
          {% endfor %}
        </select>
    </div>

    <div class="col">
        <button class="btn btn-primary w-100">Load</button>
    </div>

<input type="hidden" name="school_id" value="{{ school_id }}">
</form>
<div style="max-height: 600px; overflow-y: auto;">
    <div id="myGrid" class="ag-theme-alpine" style="width: 100%;"></div>
</div>
<div class="d-flex justify-content-between align-items-center mb-3">
    <button class="btn btn-warning" onclick="saveAll()">
        Save All
    </button>
    <button class="btn btn-success" onclick="addStudentRow()">
        ➕ Add Student Inline
    </button>
    <a id="addStudentBtn" class="btn btn-primary d-none">
        ➕ Add Student (Full Form)
    </a>
    <button class="btn btn-secondary" onclick="printMarks()">🖨️ Print</button>
    <button class="btn btn-success" onclick="exportMarksExcel()">
    📥 Export to Excel
</button>
</div>


<div class="modal fade" id="postAddModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Student Added</h5>
      </div>
      <div class="modal-body">
        What would you like to do next?
      </div>
      <div class="modal-footer">
        <a id="addAnotherBtn" class="btn btn-success">
            ➕ Add Another Student
        </a>
        <a id="proceedBtn" class="btn btn-dark">
            Continue Entering Marks
        </a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
const userRole = "{{ current_user.role }}";
const subjects = {{ subjects|tojson }};
const students = {{ students|tojson }};
const marks = {{ marks_dict|tojson }};

let gridApi;
let saveQueue = new Map();
let saveTimeout = null;

function cbcGrade(score) {
    if (isNaN(score) || score === '') return null;
    if (score >= 75) return 'EE';
    if (score >= 50) return 'ME';
    if (score >= 30) return 'AE';
    return 'BE';
}

// -------------------------
// COLUMN DEFINITIONS
// -------------------------
const columnDefs = [
    { 
        headerName: "Student", 
        field: "student", 
        editable: (params) => params.data._isNew
    }
];

subjects.forEach(sub => {
    columnDefs.push({
        headerName: sub.name,
        field: "sub_" + sub.id,
        editable: true,
        type: 'text',
        cellRenderer: function(params) {
            const val = params.value;
            if (val === '' || val == null) return '';
            const grade = cbcGrade(Number(val));
            if (!grade) return val;
            return `<span>${val} <span class="badge rounded-pill bg-info text-dark ms-1">${grade}</span></span>`;
        },
        cellStyle: (params) => {
            const val = params.value;
            if (val !== '' && val !== null && (isNaN(Number(val)) || Number(val) < 0 || Number(val) > 100)) {
                return { backgroundColor: '#f8d7da', color: '#721c24' };
            }
            return null;
        }
    });
});

// -------------------------
// ROW DATA
// -------------------------
const rowData = students.map(s => {
    let row = {
        student: s.name,
        student_id: s.id,
        _isNew: false
    };
    subjects.forEach(sub => {
        const key = String(s.id) + "_" + String(sub.id);
        row["sub_" + sub.id] = (marks[key] !== undefined) ? marks[key] : "";
    });
    return row;
});

// -------------------------
// GRID OPTIONS
// -------------------------
const gridOptions = {
    columnDefs,
    rowData,
    domLayout: "autoHeight",

    defaultColDef: {
        resizable: true,
        sortable: true,
        filter: true,
        editable: true
    },

    onCellValueChanged: (event) => {
        queueSave(event);
    },

    getContextMenuItems: (params) => {
        const studentId = params.node?.data?.student_id;
        if (!studentId) return [];

        const items = [
            {
                name: 'View Student Profile',
                action: () => window.open('/student/' + studentId, '_blank')
            }
        ];

        if (userRole === 'admin') {
            items.push('separator');
            items.push({
                name: 'Delete Student',
                action: () => {
                    if (confirm('Delete this student? All marks will be removed.')) {
                        fetch('/delete_student/' + studentId)
                            .then(res => {
                                if (res.ok) {
                                    gridApi.applyTransaction({ remove: [params.node.data] });
                                    showToast('Student deleted.', 'success');
                                } else {
                                    showToast('Failed to delete.', 'error');
                                }
                            });
                    }
                }
            });
        }

        return items;
    }
};

// -------------------------
// INIT GRID (ONLY ONCE)
// -------------------------
document.addEventListener("DOMContentLoaded", function () {
    const gridDiv = document.querySelector("#myGrid");
    if (!window.agGrid) {
        console.error("AG Grid not loaded. Check your script tag in base.html.");
        return;
    }
    gridApi = agGrid.createGrid(gridDiv, gridOptions);
});

function showToast(message, type = 'success') {
    const toastEl = document.getElementById('saveToast');
    const msgEl = document.getElementById('toastMessage');
    if (type === 'error') {
        toastEl.classList.remove('bg-success');
        toastEl.classList.add('bg-danger');
    } else {
        toastEl.classList.remove('bg-danger');
        toastEl.classList.add('bg-success');
    }
    msgEl.textContent = message;
    const toast = bootstrap.Toast.getOrCreateInstance(toastEl);
    toast.show();
}

function queueSave(event) {
    const row = event.data;
    const key = row.student_id ? row.student_id : `new_${event.node.id}`;
    saveQueue.set(key, {row: row, node: event.node});
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
        flushSaveQueue();
    }, 1000);
}

async function flushSaveQueue() {
    if (gridApi) {
        gridApi.stopEditing();
    }
    const entries = [...saveQueue.values()];
    saveQueue.clear();

    for (let entry of entries) {
        const row = entry.row;
        const node = entry.node;
        const marks = {};

        Object.keys(row).forEach(k => {
            if (k.startsWith("sub_")) {
                const val = row[k];
                if (val !== "" && val != null && !isNaN(val)) {
                    marks[k.replace("sub_", "")] = Number(val);
                }
            }
        });

        const term = getMeta("term");
        const year = getMeta("year");
        const exam = getMeta("exam");
        const grade = getMeta("grade");
        const school_id = getMeta("school_id");

        if (!grade || !term || !year) {
            alert("Please select Grade, Term and Year first");
            saveQueue.clear();
            return;
        }

        try {
            if (row._isNew) {
                if (row.student === "New Student" || !row.student.trim()) {
                    continue;
                }
                const res = await fetch('/api/add_student_with_marks', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: row.student,
                        grade: grade,
                        term: term,
                        year: year,
                        exam: exam,
                        marks: marks,
                        school_id: school_id,
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Failed to create student");
                row.student_id = data.student_id;
                row._isNew = false;
                gridApi.applyTransaction({ update: [row] });
                showToast(`Student "${row.student}" added and saved.`, 'success');
            } else {
                const res = await fetch('/save_marks', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        student_id: row.student_id,
                        term: term,
                        year: year,
                        marks: marks
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Save failed");
                showToast(`Marks for student ${row.student_id} saved.`, 'success');
            }
        } catch (err) {
            console.error("Save error:", err);
            showToast(`Error: ${err.message}`, 'error');
            const retryKey = row.student_id ? row.student_id : `new_${node.id}`;
            saveQueue.set(retryKey, entry);
        }
    }
}

async function saveAll() {
    const btn = document.querySelector(".btn-warning");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';
    try {
        await flushSaveQueue();
        try {
            showToast('All changes saved.', 'success');
        } catch (e) {
            console.warn('Toast failed:', e);
        }
    } catch (e) {
        try {
            showToast('Error saving: ' + e.message, 'error');
        } catch (e2) {}
    } finally {
        btn.disabled = false;
        btn.textContent = "Save All";
    }
}

function addStudentRow() {
    const newRow = {
        student: "New Student",
        student_id: null,
        _isNew: true
    };
    subjects.forEach(sub => {
        newRow["sub_" + sub.id] = "";
    });
    gridApi.applyTransaction({
        add: [newRow],
        addIndex: 0
    });
    setTimeout(() => {
        gridApi.startEditingCell({
            rowIndex: 0,
            colKey: 'student'
        });
    }, 100);
}

function getMeta(name) {
    const el = document.querySelector(`[name='${name}']`);
    if (!el || !el.value) {
        console.error(`Meta field ${name} is missing or empty!`);
        return null;
    }
    return el.value;
}

function printMarks() {
    if (!gridApi) return;
    const rows = [];
    gridApi.forEachNode(node => rows.push(node.data));
    const subjectNames = subjects.map(s => s.name);
    let html = '<html><head><title>Marks Report</title>';
    html += '<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">';
    html += '<style>body{padding:20px}table{width:100%}th,td{padding:4px}@media print{.btn{display:none}}</style>';
    html += '</head><body>';
    html += `<h3>Marks - ${document.querySelector("select[name='grade'] option:checked")?.text || ''} ${document.querySelector("select[name='term'] option:checked")?.text || ''} ${document.querySelector("select[name='year'] option:checked")?.text || ''}</h3>`;
    html += '<table class="table table-bordered"><thead><tr><th>Student</th>';
    subjectNames.forEach(s => html += `<th>${s}</th>`);
    html += '<th>Total</th><th>Position</th></tr></thead><tbody>';
    const withTotals = rows.map(r => {
        let total = 0;
        subjects.forEach(sub => total += Number(r["sub_"+sub.id]) || 0);
        return {...r, _total: total};
    }).sort((a,b) => b._total - a._total);
    withTotals.forEach((r, i) => r._position = i+1);
    withTotals.forEach(r => {
        html += '<tr>';
        html += `<td>${r.student}</td>`;
        subjects.forEach(sub => html += `<td>${r["sub_"+sub.id] ?? ''}</td>`);
        html += `<td>${r._total}</td><td>${r._position}</td>`;
        html += '</tr>';
    });
    html += '</tbody></table></body></html>';
    const printWin = window.open('', '_blank');
    printWin.document.write(html);
    printWin.document.close();
    printWin.print();
}

function exportMarksExcel() {
    // ... (keep this function unchanged, it's already correct) ...
    // [I've omitted it for brevity – it stays exactly as you have it]
}

window.dispatchEvent(new Event("analyticsUpdated"));
</script>

{% endblock %}
