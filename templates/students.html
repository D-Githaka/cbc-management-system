{% extends 'base.html' %}
{% block content %}

<h2>Students</h2>

<a href="/add_student" class="btn btn-primary mb-3">Add Student</a>

<table class="table">
<tr>
    <th>Name</th>
    <th>Grade</th>
    <th>Actions</th>
</tr>

{% for student in students %}
<tr>
    <td>{{ student.name }}</td>
    <td>{{ student.grade }}</td>
    <td>
        <a href="/edit_student/{{ student.id }}" class="btn btn-warning btn-sm">Edit</a>
        <a href="/delete_student/{{ student.id }}" class="btn btn-danger btn-sm"
           onclick="return confirm('Delete this student?')">Delete</a>
    </td>
</tr>
{% endfor %}

</table>

{% endblock %}
