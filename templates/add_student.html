{% extends 'base.html' %}
{% block content %}
<h2>Add Student</h2>
<a href="{{ url_for('main.students') }}" class="text-decoration-none mb-3 d-inline-block">← Back to Students</a>
<form method="POST" class="card p-4 shadow-sm">
    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Grade</label>
        <select name="grade" class="form-select"
                {% if current_user.role == 'teacher' %}disabled{% endif %}>
            {% if current_user.role == 'teacher' %}
                <option value="{{ current_user.grade }}" selected>{{ current_user.grade }}</option>
            {% else %}
                <option>PP1</option><option>PP2</option>
                <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
                <option>Grade 4</option><option>Grade 5</option><option>Grade 6</option>
                <option>Grade 7</option><option>Grade 8</option><option>Grade 9</option>
            {% endif %}
        </select>
        {% if current_user.role == 'teacher' %}
            <input type="hidden" name="grade" value="{{ current_user.grade }}">
        {% endif %}
    </div>
    <div class="mb-3">
        <label>Gender</label>
        <select name="gender" class="form-select" required>
            <option value="M">Male</option>
            <option value="F">Female</option>
        </select>
    </div>
    <div class="mb-3">
        <label>School</label>
        <select name="school_id" class="form-select"
                {% if current_user.role != 'admin' %}disabled{% endif %}>
            {% if current_user.role == 'admin' %}
                <option value="">Select School</option>
                {% for school in schools %}
                    <option value="{{ school.id }}">{{ school.name }}</option>
                {% endfor %}
            {% else %}
                <option value="{{ schools[0].id }}" selected>{{ schools[0].name }}</option>
            {% endif %}
        </select>
        {% if current_user.role != 'admin' %}
            <input type="hidden" name="school_id" value="{{ schools[0].id }}">
        {% endif %}
    </div>
    <input type="hidden" name="grade" value="{{ request.args.get('grade') }}">
    <input type="hidden" name="term" value="{{ request.args.get('term') }}">
    <input type="hidden" name="year" value="{{ request.args.get('year') }}">
    <button class="btn btn-success">Add Student</button>
</form>
{% endblock %}
