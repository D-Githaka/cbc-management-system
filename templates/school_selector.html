{% extends 'base.html' %}
{% block content %}
<h2>Select a School</h2>
<p>Choose a school to view its dashboard:</p>

<div class="list-group">
    {% for school in schools %}
    <a href="{{ url_for('school_dashboard', school_id=school.id) }}" 
       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        {{ school.name }}
        <span class="badge bg-primary rounded-pill">{{ school.type }}</span>
    </a>
    {% else %}
    <p class="text-muted">No schools found.</p>
    {% endfor %}
</div>
{% endblock %}
